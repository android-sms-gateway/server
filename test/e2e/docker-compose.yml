services:
  public:
    image: android-sms-gateway/server:public
    build:
      context: ../..
      dockerfile: ./build/package/Dockerfile
      args:
        - APP=sms-gateway
    environment:
      - DEBUG=
      - CONFIG_PATH=config.yml
      - GOOSE_DBSTRING=sms:sms@tcp(db:3306)/sms
      - HTTP__LISTEN=0.0.0.0:3000
      - DATABASE__HOST=db
      - DATABASE__PORT=3306
      - DATABASE__USER=sms
      - DATABASE__PASSWORD=sms
      - DATABASE__DATABASE=sms-public
      - GATEWAY__MODE=public
      - FCM__CREDENTIALS_JSON=${FCM__CREDENTIALS_JSON}
    ports:
      - "3000:3000"
    volumes:
      - ./data/config.yml:/app/config.yml:ro
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy

  private:
    image: android-sms-gateway/server:private
    build:
      context: ../..
      dockerfile: ./build/package/Dockerfile
      args:
        - APP=sms-gateway
    environment:
      - DEBUG=
      - CONFIG_PATH=config.yml
      - GOOSE_DBSTRING=sms:sms@tcp(db:3306)/sms
      - HTTP__LISTEN=0.0.0.0:3000
      - DATABASE__HOST=db
      - DATABASE__PORT=3306
      - DATABASE__USER=sms
      - DATABASE__PASSWORD=sms
      - DATABASE__DATABASE=sms-private
      - GATEWAY__MODE=private
      - GATEWAY__PRIVATE_TOKEN=123456789
    ports:
      - "3001:3000"
    volumes:
      - ./data/config.yml:/app/config.yml:ro
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy

  db:
    # Every supported engine is exercised in CI by overriding DB_IMAGE:
    # mariadb:10.2.7, mariadb:lts, mysql:8.0.13, mysql:lts.
    image: ${DB_IMAGE:-mariadb:lts}
    environment:
      # Each image ignores the other's variables, so both are set to cover either engine.
      - MYSQL_ROOT_PASSWORD=root
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./data/10-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    restart: "unless-stopped"
    # No single admin binary exists on every supported engine: current MariaDB images ship
    # `mariadb-admin` while MySQL and MariaDB 10.2 ship `mysqladmin`, so both are tried.
    # `ping` reports success over TCP even when it is refused, and the temporary server the
    # entrypoint runs for the init scripts listens on the socket only, so this stays unhealthy
    # until initialization finishes.
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 --silent || mysqladmin ping -h 127.0.0.1 --silent"]
      start_period: 30s
      interval: 4s
      timeout: 2s
      retries: 15
